
name: Gerar LZ Painel EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verificar Python e controles da janela
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -p test_window.py -v

      - name: Preparar Node para testar a interface
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar navegacao e FPS Boost
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          node tests/ui_smoke.cjs

      - name: Salvar capturas da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LZ-Painel-Preview
          path: test-results/*.png
          if-no-files-found: ignore

      - name: Criar Painel.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Painel --icon icone.ico --add-data "index.html;." --add-data "assets;assets" --collect-all webview app.py

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: LZ-Painel-Windows
          path: dist/Painel.exe
          if-no-files-found: error

